<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>Arcading 2D</title>
<style>
      body { 
        margin: 0; 
        padding: 0; 
        overflow: hidden; 
        background-color: #231F20; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
      }
      canvas { 
        height: 100vh; 
        aspect-ratio: 360 / 640; 
        max-width: 100vw; 
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas"></canvas>
    <script src="Build/Arcading-2D.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/Arcading-2D.data",
        frameworkUrl: "Build/Arcading-2D.framework.js",
        codeUrl: "Build/Arcading-2D.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "arcading",
        productVersion: "1.0",
      }).catch((message) => {
        alert("Ошибка Unity: " + message);
      });
    </script>
  </body>
</html>
